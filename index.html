<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="board">
        <div class="top-bar"></div>

        <section class="content">
            <h1>Sticky Notes</h1>

            <div id="notes" class="notes">
                <!-- New notes will be added here by JavaScript. -->
            </div>

            <div class="new-note">
                <textarea id="noteText" placeholder="Type a new note..."></textarea>
                <button id="addButton" aria-label="Add note">+</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
