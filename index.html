<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f1f1">
  <title>Sticky Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="notes-panel" aria-labelledby="page-title">
    <h1 id="page-title">Sticky Notes</h1>
    <section class="notes-grid" id="notes" aria-label="Your notes" aria-live="polite"></section>
    <form class="composer" id="note-form">
      <label class="visually-hidden" for="note-input">Write a new note</label>
      <textarea id="note-input" placeholder="Type a new note..." rows="4" maxlength="500" required></textarea>
      <button class="add-button" type="submit" aria-label="Add note" title="Add note">+</button>
    </form>
  </main>
</body>
</html>
